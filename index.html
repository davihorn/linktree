<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Links</title>
    
    <!-- Tag do Favicon -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    
    <style>
        /* Paleta de cores e variáveis */
        :root {
            /* Fundo cinza escuro mantido */
            --bg-top: #4a4a4a; 
            --bg-bottom: #262626; 
            --text-color: #f8fafc;
            --btn-bg: #1e293b;
            --btn-hover: #334155;
            --accent: #38bdf8;
            --warning-bg: #fffbeb;
            --warning-text: #92400e;
            --warning-border: #fcd34d;
        }

        /* Reset e estilo global */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container principal - Responsivo */
        .container {
            width: 100%;
            max-width: 480px; 
            padding: 40px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* FOTO DA MARCA - O truque do fundo transparente está aqui */
        .profile {
            width: 180px; /* Aumentei um pouco para ficar em destaque como no seu desenho */
            height: auto; /* Mantém a proporção quadrada/retangular original da sua foto */
            margin: 0 auto 15px;
            display: block;
            
            /* ESSA É A MÁGICA: Remove o fundo branco da sua imagem e mescla com o cinza! */
            mix-blend-mode: multiply; 
            
            /* DICA: Se o leão ficar muito escuro no fundo cinza e você quiser deixar a logo toda BRANCA, 
               apague a linha de cima (mix-blend) e use essa linha de baixo (apague as barras //): */
            /* filter: invert(1) brightness(2); */
        }

        /* Textos */
        p.bio {
            font-size: 15px;
            color: #94a3b8;
            margin: 0 0 25px;
        }

        /* Aviso de Manutenção */
        .maintenance {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid var(--warning-border);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 500;
        }

        /* Lista de Links */
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Botões dos Links */
        .link-btn {
            background-color: var(--btn-bg);
            color: var(--text-color);
            text-decoration: none;
            padding: 16px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid transparent;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Efeitos ao passar o mouse (Hover) */
        .link-btn:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        .wpp:hover { border-color: #25D366; color: #25D366; }
        .ig:hover { border-color: #E1306C; color: #E1306C; }
        .tiktok:hover { border-color: #7425f4; color: #7425f4; } /* Corrigido para o Ciano do TikTok */
        .catalog:hover { border-color: var(--accent); color: var(--accent); }

        /* Ícones SVG */
        .icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
